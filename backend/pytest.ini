[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py
python_classes = Test*
python_functions = test_* deve_* nao_deve_*
testpaths = apps tests
# -ra mostra no final o motivo de cada teste pulado/falho; --strict-markers evita marcador digitado errado.
addopts = -ra --strict-markers
